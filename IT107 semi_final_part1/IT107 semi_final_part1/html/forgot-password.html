<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forgot password</title>
    <link rel="stylesheet" href="../css/forgot-password.css">
    <link rel="stylesheet" href="../css/common.css">
    <!--<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> -->
</head>
<body>
    <header>
     <div class="container">
        <div class="brand">
          <img src="../images/Caraga_State.png" alt="Caraga State University" class="brand-mark" />
          <img src="../images/Caraga.png" alt="Caraga State University" class="brand-text" />
        </div>
        <nav class="nav">
          <a href="home.html">Home</a>
          <a href="login.html">Login</a>
          <a href="register.html">Register</a>
        </nav>
    </div>
     </header>

    <div class="forgot-password">
        <h1>🔐 Forgot Password</h1>
        <p class="forgot-subtitle">Enter your ID to begin password recovery</p>
        
        <form action="" method="" name="forgotForm" onsubmit="return validateForgotForm()" novalidate>
            
            <!-- ID Row -->
            <div class="input-row">
                <div class="input-container">
                    <label for="ID">ID Number</label>
                    <input type="text" name="ID" id="ID" placeholder="Enter your ID" >
                </div>
                <div id="idError" class="error-message"></div>
            </div>

            <div class="button-container">
                <button type="button" id="prevBtn" class="prev-btn">Previous</button>
                <button type="submit">Continue</button>
            </div>
        </form>
    </div>

    <footer>&copy;Caraga State University 2025</footer>
    <script src="../javascript/forgot-password.js"></script>
    <!-- <script src="../javascript/disable_back.js"></script> -->
</body>
</html>
