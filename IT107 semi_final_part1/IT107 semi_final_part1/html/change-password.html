<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="stylesheet" href="../css/change-password.css">
</head>
<body>
    <header>
        <div class="container">
           <div class="brand">
             <img src="../images/Caraga_State.png" alt="Caraga State University" class="brand-mark" />
             <img src="../images/Caraga.png" alt="Caraga State University" class="brand-text" />
           </div>
           <nav class="nav">
             <a href="home.html">Home</a>
             <a href="login.html">Login</a>
             <a href="register.html">Register</a>
           </nav>
        </div>
    </header>
    <main class="main-content">
        <div class="change-password-box">
            <h2>Change Password</h2>
            
            <!-- User Information Display -->
            <div class="user-info-section">
                <div class="user-info-row">
                    <div class="info-column">
                        <label>ID Number:</label>
                        <div class="user-display" id="idDisplay">Loading...</div>
                    </div>
                    <div class="info-column">
                        <label>Username:</label>
                        <div class="user-display" id="usernameDisplay">Loading...</div>
                    </div>
                </div>
            </div>
            
            <form id="changePasswordForm" action="../php/change-password.php" method="POST" novalidate>
                <div class="form-group">
                    <label for="new_password">New Password</label>
                    <input type="password" id="new_password" name="new_password" required
                           onkeyup="validateNewPassword()">
                    <div id="passwordError" class="error-message"></div>
                    <div id="passwordStrength" class="password-strength"></div>
                </div>
                
                <div class="form-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required
                           onkeyup="validateConfirmPassword()">
                    <div id="confirmPasswordError" class="error-message"></div>
                </div>
                
                <div id="message" class="message"></div>
                <div class="form-actions">
                    <button type="button" onclick="window.history.back()" class="btn btn-back">
                        <i class="fas fa-arrow-left"></i> Back
                    </button>
                    <button type="submit" class="btn">Change Password</button>
                </div>
            </form>
        </div>
    </div>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="../javascript/change-password.js"></script>
    <footer>&copy;Caraga State University 2025</footer>
</body>
</html>
