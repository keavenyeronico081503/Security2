<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email</title>
    <link rel="stylesheet" href="../css/question.css">
    <link rel="stylesheet" href="../css/common.css">
</head>
<body>
  <div class="container">
    <h2>Verify Your Institutional Email</h2>
    <div id="message"></div>

    <p>We sent a 6-digit verification code to <strong id="emailDisplay">your institutional email</strong>. Enter it below to confirm it's really you.</p>

    <div class="question-group">
      <label for="otpInput">Verification Code</label>
      <input type="text" id="otpInput" name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456">
      <div class="button-container">
        <button id="prevBtn" class="prev-btn" type="button">Back</button>
        <button id="verifyBtn" class="next-btn" type="button">Verify</button>
      </div>
    </div>

    <p>
      Didn't get the code?
      <button id="resendBtn" type="button" class="prev-btn" style="width:auto;display:inline-block;padding:6px 12px;">Resend Code</button>
    </p>
  </div>

<script src="../javascript/verify-email.js"></script>
</body>
</html>
